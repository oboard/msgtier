name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: msgtier-linux-x64
            installer: unix.sh
          - runner: ubuntu-24.04-arm
            artifact: msgtier-linux-arm64
            installer: unix.sh
          - runner: macos-15
            artifact: msgtier-macos-arm64
            installer: unix.sh
          - runner: windows-latest
            artifact: msgtier-windows-x64.exe
            installer: powershell.ps1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          module_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' moon.mod)"
          binary_version="$(sed -n 's/.*version: "\([^"]*\)", config: None.*/\1/p' cmd/main/config.mbt)"
          if [[ "${GITHUB_REF_NAME#v}" != "$module_version" || "$module_version" != "$binary_version" ]]; then
            echo "Tag ${GITHUB_REF_NAME}, moon.mod ${module_version}, binary ${binary_version} must match." >&2
            exit 1
          fi

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/msgtier-web/pnpm-lock.yaml

      - name: Build embedded web UI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd web/msgtier-web
          pnpm install --frozen-lockfile
          pnpm run build
          cd dist
          zip -qr ../../dist.zip .

      - name: Build embedded web UI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location web/msgtier-web
          pnpm install --frozen-lockfile
          pnpm run build
          Compress-Archive -Path dist/* -DestinationPath ../dist.zip

      - name: Install MoonBit (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o moonbit-install.sh
          bash moonbit-install.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://cli.moonbitlang.com/install/powershell.ps1 -OutFile moonbit-install.ps1
          & ./moonbit-install.ps1
          "$env:USERPROFILE\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Check and build
        shell: bash
        run: |
          moon version --all
          moon update
          moon install
          moon check --deny-warn
          moon test --target native
          moon build cmd/main --release --target native
          mkdir -p artifacts
          cp _build/native/release/build/cmd/main/main.exe artifacts/${{ matrix.artifact }}
          if [[ "${{ runner.os }}" != Windows ]]; then
            chmod +x artifacts/${{ matrix.artifact }}
          fi
          artifacts/${{ matrix.artifact }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: msgtier-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum msgtier-* > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
